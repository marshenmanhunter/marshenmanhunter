<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keel Budget</title>
<meta name="theme-color" content="#1E5A44">
<meta name="description" content="Keel: budgets, accounts, forecasts, reimbursements and shared costs in one private app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Keel">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="sample.js"></script>
</head>
<body>
<style>
/* Layout: a left rail holds navigation, privacy toggle and save status; the workspace on the right reads top to bottom as summary tiles, then charts, then ledgers. Under 860px the rail folds into a top bar with a scrolling tab row. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F6F8F6; --sunken:#E5EAE6;
  --ink:#15201A; --ink-2:#44524A; --muted:#66746C; --line:#DAE1DC; --line-2:#C3CDC6;
  --accent:#1E5A44; --accent-hover:#164536; --accent-ink:#FFFFFF; --accent-soft:#DCEAE2;
  --pos:#18794A; --neg:#B4372B;
  --warn:#7E5300; --warn-bg:#FBEFD3; --warn-mark:#E0A019;
  --crit:#B4372B; --crit-bg:#FBE6E3; --crit-mark:#D03B3B;
  --s1:#2a78d6; --s2:#eb6834;
  --grid:#E6EBE7; --axis:#C3CDC6; --sel:#EDF3EF; --overlay:rgba(14,24,19,.42);
  --shadow:0 1px 2px rgba(15,35,25,.05), 0 10px 30px rgba(15,35,25,.08);
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1310; --surface:#151C18; --surface-2:#1A231E; --sunken:#0F1512;
    --ink:#E4ECE7; --ink-2:#B4C2BA; --muted:#8A988F; --line:#25302A; --line-2:#34413A;
    --accent:#62C497; --accent-hover:#7ED3AB; --accent-ink:#08170F; --accent-soft:#1C3328;
    --pos:#5CCB91; --neg:#F08374;
    --warn:#F0B54A; --warn-bg:#33270F; --warn-mark:#E0A019;
    --crit:#F08374; --crit-bg:#3A1D19; --crit-mark:#E66767;
    --s1:#3987e5; --s2:#d95926;
    --grid:#212B26; --axis:#34413A; --sel:#1C2621; --overlay:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151C18; --surface-2:#1A231E; --sunken:#0F1512;
  --ink:#E4ECE7; --ink-2:#B4C2BA; --muted:#8A988F; --line:#25302A; --line-2:#34413A;
  --accent:#62C497; --accent-hover:#7ED3AB; --accent-ink:#08170F; --accent-soft:#1C3328;
  --pos:#5CCB91; --neg:#F08374;
  --warn:#F0B54A; --warn-bg:#33270F; --warn-mark:#E0A019;
  --crit:#F08374; --crit-bg:#3A1D19; --crit-mark:#E66767;
  --s1:#3987e5; --s2:#d95926;
  --grid:#212B26; --axis:#34413A; --sel:#1C2621; --overlay:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700;line-height:1.15}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.num,.amt{font-variant-numeric:tabular-nums}
.hide .m{filter:blur(6px)}
.hide .chart .ytick{filter:blur(4px)}
.hide .money-in input{color:transparent;text-shadow:0 0 9px var(--ink)}

/* App shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  padding-block:22px 18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px}
.rail-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding-left:6px}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:var(--r-sm);background:var(--surface-2)}
.rail-foot .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--accent)}
.rail-foot .dot.local{background:var(--warn-mark)}
.rail-foot .dot.none{background:var(--crit-mark)}
main{min-width:0;padding-block:28px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
@media (min-width:861px){main{padding-left:36px;padding-right:max(36px, env(safe-area-inset-right, 0px))}}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;overflow:visible;gap:10px;border-right:0;border-bottom:1px solid var(--line);
    padding-block:12px 8px;padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:7px 11px}
  .rail-foot{display:none}
  main{padding-block:20px 64px}
  h1{font-size:24px}
}

/* Page header */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--crit-mark);border-color:var(--crit-mark);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-sm);background:var(--sunken);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--muted);font-size:12px}
.input,select.input,textarea.input{height:36px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.money-in{position:relative;display:block}
.money-in::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money-in .input{padding-left:22px;text-align:right;font-variant-numeric:tabular-nums}
.pct-in{position:relative;display:block}
.pct-in::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.pct-in .input{padding-right:24px;text-align:right}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{margin-top:3px;accent-color:var(--accent)}
.fs{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.fs legend{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 4px}
.radio{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.radio input{accent-color:var(--accent)}
.radio:has(input:disabled){color:var(--muted);cursor:not-allowed}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px;flex-wrap:wrap}
.card-head p{color:var(--muted);font-size:12.5px}
.card-body{padding:10px 18px 18px}
.card-link{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.card-link:hover{text-decoration:underline}
.card.fill{display:flex;flex-direction:column}
.card.fill .card-body{flex:1;display:flex;flex-direction:column}
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-half{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1080px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g-2,.g-half{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g-3{grid-template-columns:minmax(0,1fr)}}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:start}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;border-left:1px solid var(--line);align-self:stretch}
.tile:first-child{border-left:0}
.tile-label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile-value{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.spark{width:96px;height:34px;flex:none}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.75;vector-effect:non-scaling-stroke}
@media (max-width:980px){.tiles,.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:nth-child(3){border-left:0}.tile:nth-child(n+3){border-top:1px solid var(--line)}
  .tiles.t3 .tile:nth-child(3){grid-column:1/-1}}
@media (max-width:420px){.tile-value{font-size:22px}.spark{display:none}}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)}
.delta svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Show the math */
.explain summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;list-style:none;display:inline-flex;gap:4px;align-items:center;border-radius:4px}
.explain summary::-webkit-details-marker{display:none}
.explain summary svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.explain dl{margin:8px 0 0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2)}
.explain dl div{display:flex;justify-content:space-between;gap:12px}
.explain dl div.total{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.explain dt{color:var(--ink-2)}
.explain dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.explain p{font-size:12px;color:var(--muted);margin-top:6px}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chips{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Meters */
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.near i{background:var(--warn-mark)}
.meter.over i{background:var(--crit-mark)}
.meter.inc i{background:var(--s1)}

/* Lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.stack{flex-direction:column;align-items:stretch;gap:7px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub.wrap{white-space:normal}
.note{font-size:12.5px;color:var(--muted);max-width:62ch}
.note svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-2px}
.row-line{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.amt{font-weight:600;text-align:right;white-space:nowrap}
.amt.pos{color:var(--pos)}
.amt.neg{color:var(--neg)}
.muted{color:var(--muted);font-weight:500}
.date-chip{width:44px;flex:none;text-align:center;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);padding:3px 0;line-height:1.15}
.date-chip b{display:block;font-family:var(--f-display);font-size:16px}
.date-chip span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:22px 4px;color:var(--muted);text-align:center;font-size:13.5px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:15px;margin-bottom:4px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.alert:first-child{border-top:0}
.alert:hover .alert-text{color:var(--accent)}
.alert-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--sunken);color:var(--ink-2)}
.alert-ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.alert-ic.warn{background:var(--warn-bg);color:var(--warn)}
.alert-ic.crit{background:var(--crit-bg);color:var(--crit)}
.alert-text{font-size:13.5px;font-weight:500;min-width:0}
.alert-text small{display:block;color:var(--muted);font-size:12px;font-weight:400}

/* Budget rows */
.brow{display:grid;grid-template-columns:minmax(0,1.4fr) 116px minmax(0,.9fr) minmax(0,1.3fr);gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.brow.head{border-top:0;padding-top:2px;font-size:11.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.brow .bname{min-width:0;display:flex;align-items:center;gap:4px}
.brow .bname>span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.brow .bname small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.brow .bnum{text-align:right}
.brow .bprog{display:flex;flex-direction:column;gap:5px;min-width:0}
.brow .bprog small{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.brow .money-in .input{height:32px}
.brow .icon-btn{width:26px;height:26px}
@media (max-width:640px){
  .brow{grid-template-columns:minmax(0,1fr) 108px;row-gap:6px}
  .brow .bnum{display:none}
  .brow .bprog{grid-column:1/-1}
  .brow.head{display:none}
}
.group-total{font-size:12.5px;color:var(--muted)}

/* Transactions */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .search{flex:1 1 220px;min-width:0;position:relative}
.filters .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.filters .search .input{padding-left:32px}
.filters select.input{width:auto;flex:1 1 140px;max-width:200px}
@media (max-width:640px){.filters select.input{max-width:none}}
.tx-summary{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tx-summary b{color:var(--ink);font-weight:600}
.day{padding:0 18px}
.day-head{display:flex;justify-content:space-between;padding:12px 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:minmax(0,1fr) 190px 120px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.day .tx:last-child{border-bottom:0}
.tx-open{all:unset;cursor:pointer;min-width:0;display:flex;flex-direction:column;border-radius:6px}
.tx-open:hover .row-title{color:var(--accent)}
.tx-open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tx select.input{height:32px;font-size:13px;padding:0 6px}
.amt small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
@media (max-width:700px){

/* ---------- views ---------- */
const VIEWS = {};
const NAV = [['overview', 'Overview'], ['accounts', 'Accounts'], ['transactions', 'Transactions'], ['cash-flow', 'Cash flow'], ['forecast', 'Forecast'], ['budget', 'Budget'], ['recurring', 'Recurring'], ['goals', 'Goals'], ['settle-up', 'Settle up'], ['categories', 'Categories']];

VIEWS.overview = () => {
  const st = monthStats(CUR), prevYm = addM(CUR, -1);
  const nw = netWorthAt(CUR), nwPrev = netWorthAt(prevYm), series = nwSeries(12);
  const bmap = budgetFor(CUR).map, expCats = S.settings.categories.filter(c => typeOf(c.id) === 'expense');
  const budTotal = sum(expCats, c => (bmap[c.id] || 0) + carryFor(c, CUR));
  const dayFrac = Math.min(1, new Date().getDate() / daysIn(CUR)), pace = budTotal > 0 ? st.expense / (budTotal * dayFrac) : 0;
  const paceChip = budTotal <= 0 ? '' : st.expense > budTotal ? `<span class="chip crit">${ic('alert')}Over budget</span>` : pace > 1.1 ? `<span class="chip warn">${ic('alert')}Ahead of pace</span>` : `<span class="chip ok">${ic('check')}On pace</span>`;
  const sts = safeToSpend(), rw = runway();
  const stsExplain = explain([[pooled() ? `Combined cash (${IX.pool.size} accounts)` : 'Cash in checking', money(sts.cash)], ['Credit card balances', money(-sts.owed)], [`Bills due before ${dShort(sts.until)} (${sts.bills.length})`, money(-sts.billTotal)], ['Goal savings for this month', money(-sts.goals)], ['Safe to spend', money(sts.value), true]],
    sts.hasPay ? `Counts until your next expected income on ${dShort(sts.until)}. Shared bills count in full because you pay them up front.` : 'No recurring income is set, so this counts to the end of the month.');
  const rwExplain = explain([['Cash and savings', money(rw.liquid)], ['Essential spending per month', money(rw.av.ess)], ['All spending per month', money(rw.av.total)], ['Months at essential level', rw.ess === null ? '–' : months1(rw.ess), true]],
    `Spending is your average over the last ${rw.av.n || 0} full months. Mark which categories are essential on the Categories page.`);
  const tiles = `<div class="tiles">
    <div class="tile"><span class="tile-label">Net worth</span><div class="tile-row"><span class="tile-value">${money(nw, true)}</span>${sparkline(series.slice(-6).map(p => p.value))}</div><span class="tile-sub">${deltaHtml(round2(nw - nwPrev))} since ${mShort(prevYm)}</span></div>
    <div class="tile"><span class="tile-label">Safe to spend</span><span class="tile-value"${sts.value < 0 ? ' style="color:var(--neg)"' : ''}>${money(sts.value, true)}</span><span class="tile-sub">${pooled() ? 'From all your cash accounts, until ' : 'Until '}${dShort(sts.until)}, after bills, cards and goals</span>${stsExplain}</div>
    <div class="tile"><span class="tile-label">Spent in ${mName(CUR)}</span><span class="tile-value">${money(st.expense, true)}</span><span class="tile-sub">${budTotal > 0 ? `of ${money(budTotal, true)} ${paceChip}` : 'No budget set'}</span></div>
    <div class="tile"><span class="tile-label">Emergency runway</span><span class="tile-value">${rw.ess === null ? '–' : months1(rw.ess) + ' months'}</span><span class="tile-sub">${rw.all === null ? 'Needs a month of spending history' : months1(rw.all) + ' months at your current spending'}</span>${rwExplain}</div>
  </div>`;
  const att = attention();
  const attCard = `<div class="card"><div class="card-head"><div><h2>Needs attention</h2><p>${att.length ? att.length + ' item' + (att.length === 1 ? '' : 's') : 'Nothing right now'}</p></div></div><div class="card-body">${att.length ? att.map(a => `<a class="alert" href="${a.href}"${a.act ? ` data-act="${a.act}"` : ''}><span class="alert-ic ${a.sev === 'info' ? '' : a.sev}">${ic(a.icon)}</span><span class="alert-text">${a.text}<small>${a.sub}</small></span></a>`).join('') : `<div class="empty"><b>All clear</b>Budgets, bills, trials and reimbursements look fine.</div>`}</div></div>`;
  const topCats = expCats.map(c => ({ c, b: (bmap[c.id] || 0) + carryFor(c, CUR), s: round2(-(st.byCat[c.id] || 0)) })).filter(x => x.b > 0 || x.s > 0).sort((a, b) => (b.s / (b.b || 1)) - (a.s / (a.b || 1))).slice(0, 5);
  const budgetCard = `<div class="card"><div class="card-head"><div><h2>Budget in ${mName(CUR)}</h2><p>Closest to their limit</p></div><a class="card-link" href="#budget">Open budget</a></div><div class="card-body"><div class="rows">${topCats.length ? topCats.map(x => `
    <div class="row stack"><div class="row-line" style="flex-wrap:nowrap"><span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="row-title">${esc(x.c.name)}</span>${statusChip(x.s, x.b)}</span><span class="amt">${money(x.s, true)} <span class="muted">of ${money(x.b, true)}</span></span></div>${meterHtml(x.s, x.b)}</div>`).join('')
    : `<div class="empty"><b>No budget yet</b>Set monthly limits on the Budget page.</div>`}</div></div></div>`;
  const nwCard = `<div class="card fill"><div class="card-head"><div><h2>Net worth</h2><p>Assets minus debts at the end of each month</p></div><a class="card-link" href="#accounts">See accounts</a></div><div class="card-body">${series.length > 1 ? chartSlot('ch-nw-dash', { type: 'line', labels: series, lines: [{ name: 'Net worth', values: series.map(p => p.value) }], label: 'Net worth by month' }, 'fill') : `<div class="empty"><b>${money(nw, true)} today</b>This chart fills in month by month as your balances change.</div>`}</div></div>`;
  const recent = IX.all.filter(t => !IX.internal.has(t.id)).slice(0, 6);
  const recentCard = `<div class="card"><div class="card-head"><h2>Recent transactions</h2><a class="card-link" href="#transactions">See all</a></div><div class="card-body"><div class="rows">${recent.length ? recent.map(t => `<div class="row"><div class="row-main">${txRow(t, true)}</div>${amtHtml(t)}</div>`).join('') : `<div class="empty"><b>No transactions yet</b>Add one or import a CSV from your bank.</div>`}</div></div></div>`;
  const to14 = addDays(TODAY, 14);
  const up = S.settings.recurring.flatMap(r => occurrences(r, TODAY, to14).map(d => ({ d, name: r.name, amount: r.amount, sub: catName(r.categoryId) })))
    .concat(cardDues(TODAY, to14).map(({ d, a }) => ({ d, name: a.name + ' payment', amount: a.balance, sub: 'Card balance due' })))
    .sort((a, b) => a.d.localeCompare(b.d)).slice(0, 6);
  const upCard = `<div class="card"><div class="card-head"><h2>Next 14 days</h2><a class="card-link" href="#recurring">Recurring</a></div><div class="card-body"><div class="rows">${up.length ? up.map(u => `<div class="row"><div class="date-chip"><span>${mShort(u.d.slice(0, 7))}</span><b>${+u.d.slice(8)}</b></div><div class="row-main"><div class="row-title">${esc(u.name)}</div><div class="row-sub">${u.d === TODAY ? 'Today' : 'In ' + daysBetween(TODAY, u.d) + ' days'} · ${esc(u.sub)}</div></div><span class="amt ${u.amount > 0 ? 'pos' : ''}">${u.amount > 0 ? signed(u.amount) : money(u.amount)}</span></div>`).join('') : `<div class="empty"><b>Nothing due</b>Add bills and paychecks on the Recurring page.</div>`}</div></div></div>`;
  return `<div class="wrap">${head('Overview', dLong(TODAY))}${sampleBanner()}${tiles}<div class="grid g-2">${nwCard}${attCard}</div><div class="grid g-3">${budgetCard}${upCard}${recentCard}</div></div>`;
};

VIEWS.accounts = () => {
  const accts = S.settings.accounts, prevYm = addM(CUR, -1);
  const assets = sum(accts.filter(a => !isLiab(a)), a => a.balance), debts = -sum(accts.filter(isLiab), a => a.balance);
  const series = nwSeries(S.ui.nwRange), dues = cardDues(TODAY, addDays(TODAY, 40));
  const rangeSeg = `<div class="seg" role="group" aria-label="Chart range">${[[6, '6M'], [12, '1Y'], [0, 'All']].map(([v, l]) => `<button data-act="nw-range" data-v="${v}" aria-pressed="${S.ui.nwRange === v}">${l}</button>`).join('')}</div>`;
  let groups = '';
  for (const gName of AGROUPS) {
    const list = accts.filter(a => (ATYPES[a.type] || ATYPES.other).group === gName); if (!list.length) continue;
    const total = sum(list, a => a.balance);
    groups += `<div class="card"><div class="card-head"><h2>${gName}</h2><span class="amt">${money(Math.abs(total))}${total < 0 ? ' owed' : ''}</span></div><div class="card-body"><div class="rows">${list.map(a => {
      const ch = round2(a.balance - balAt(a, prevYm)), liab = isLiab(a);
      const chText = liab ? (ch > 0 ? money(ch, true) + ' paid down' : money(-ch, true) + ' more owed') : signed(ch, true) + ' this month';
      const due = dues.find(x => x.a.id === a.id);
      const meta = [(ATYPES[a.type] || ATYPES.other).label, a.institution, a.apr ? a.apr + '% APR' : ''].filter(Boolean).map(esc).join(' · ');
      return `<div class="acct"><div class="acct-name"><span class="acct-badge" aria-hidden="true">${esc((a.name || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '·')}</span><div style="min-width:0"><div class="row-title">${esc(a.name)}</div><div class="row-sub">${meta}</div>${due ? `<span class="chip ${daysBetween(TODAY, due.d) <= 3 ? 'warn' : ''}" style="margin-top:4px">${ic('clock')}Payment due ${dShort(due.d)}</span>` : ''}</div></div>
        <div class="amt">${money(Math.abs(a.balance))}${liab ? '<small class="muted">owed</small>' : ''}${Math.abs(ch) >= 0.5 ? `<small class="delta ${ch > 0 ? 'up' : 'down'}">${chText}</small>` : ''}</div>
        <div class="acct-acts">${can() ? `<button class="btn sm" data-act="update-balance" data-id="${a.id}">Update balance</button><button class="icon-btn" data-act="edit-account" data-id="${a.id}" aria-label="Edit ${esc(a.name)}">${ic('edit')}</button>` : ''}</div></div>`;
    }).join('')}</div></div></div>`;
  }
  if (!accts.length) groups = `<div class="card"><div class="card-body"><div class="empty"><b>No accounts yet</b>Add your checking account first, then savings, cards, investments, and loans. Your net worth adds them up.</div><div style="display:flex;justify-content:center">${btn('add-account', 'Add account', 'primary', 'plus')}</div></div></div>`;
  return `<div class="wrap">${head('Accounts', accts.length + ' account' + (accts.length === 1 ? '' : 's'), btn('add-account', 'Add account', 'primary', 'plus'))}${sampleBanner()}
    <div class="tiles t3"><div class="tile"><span class="tile-label">Assets</span><span class="tile-value">${money(assets, true)}</span><span class="tile-sub">Cash, investments, property</span></div><div class="tile"><span class="tile-label">Debts</span><span class="tile-value">${money(debts, true)}</span><span class="tile-sub">Credit cards and loans</span></div><div class="tile"><span class="tile-label">Net worth</span><span class="tile-value">${money(assets - debts, true)}</span><span class="tile-sub">${deltaHtml(round2(netWorthAt(CUR) - netWorthAt(prevYm)))} since ${mShort(prevYm)}</span></div></div>
    <div class="card"><div class="card-head"><div><h2>Net worth over time</h2><p>Balances at the end of each month</p></div>${rangeSeg}</div><div class="card-body">${series.length > 1 ? chartSlot('ch-nw', { type: 'line', labels: series, lines: [{ name: 'Net worth', values: series.map(p => p.value) }], label: 'Net worth by month' }, 260) : `<div class="empty"><b>One month so far</b>Come back next month to see the trend. Each balance update adds a point.</div>`}</div></div>
    ${poolCard()}
    <div class="grid g-half" style="align-items:start">${groups}</div>
    <div class="grid g-half" style="align-items:start">${rewardsCard()}${payoffCard()}</div></div>`;
};
function poolCard() {
  const p = S.settings.pool, on = !!p.enabled, chosen = new Set(poolChosen());
  const cashAccts = S.settings.accounts.filter(a => !isLiab(a));
  if (cashAccts.length < 2) return '';
  const total = sum(cashAccts.filter(a => chosen.has(a.id)), a => a.balance), moves = IX.internal.size / 2;
  return `<div class="card"><div class="card-head"><div><h2>Combine my cash</h2><p>Treat these accounts as one pot of money. Moving money between them stops counting as spending or income and drops out of your transaction list.</p></div>
    ${can() ? `<button class="btn ${on ? '' : 'primary'}" data-act="pool-toggle" aria-pressed="${on}">${on ? 'Turn off' : 'Turn on'}</button>` : ''}</div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:12px">
      ${on ? `<div class="banner"><p><b>${money(total)}</b> across ${chosen.size} account${chosen.size === 1 ? '' : 's'}. ${moves ? `${moves} move${moves === 1 ? '' : 's'} between them hidden. <button class="card-link" data-act="show-internal">See them</button>` : 'No moves between them found yet.'}</p></div>` : ''}
      <div class="chips">${cashAccts.map(a => `<label class="check" style="align-items:center"><input type="checkbox" data-change="pool-acct" value="${a.id}"${chosen.has(a.id) ? ' checked' : ''}${can() ? '' : ' disabled'}> <span>${esc(a.name)}</span></label>`).join('')}</div>
      <p class="note">Safe to spend uses the combined total when this is on. A move counts when the same amount leaves one of these accounts and arrives in another within 3 days.</p>
    </div></div>`;
}
function rewardsCard() {
  const rc = rewardsCheck();
  if (!rc) return `<div class="card"><div class="card-head"><div><h2>Card rewards check</h2><p>Find out which card to use for each kind of purchase</p></div></div><div class="card-body"><div class="empty"><b>No reward rates yet</b>Edit a credit card and add its rewards rate. With two or more cards, Keel shows where you are leaving money behind.</div></div></div>`;
  const rows = rc.rows.filter(r => r.spend > 0).slice(0, 6);
  const catsSeen = [...new Set(rc.rows.map(r => r.cat))];
  const guide = catsSeen.map(cid => { let best = null, br = -1; for (const c of rc.cards) { const r = rateFor(c, cid); if (r > br) { br = r; best = c; } } return { cid, best, br }; }).filter(g => g.br > 0).slice(0, 8);
  return `<div class="card"><div class="card-head"><div><h2>Card rewards check</h2><p>Last 90 days of card spending</p></div></div><div class="card-body" style="display:flex;flex-direction:column;gap:14px">
    <div class="mini-tiles"><div><span>Earned</span><b>${money(rc.earned)}</b></div><div><span>Missed</span><b style="color:${rc.missed > 0.5 ? 'var(--neg)' : 'inherit'}">${money(rc.missed)}</b></div><div><span>Missed per year</span><b>${money(rc.yearly, true)}</b></div></div>
    <div class="rows">${rows.map(r => `<div class="row"><div class="row-main"><div class="row-title">${esc(catName(r.cat))}</div><div class="row-sub wrap">${money(r.spend, true)} on ${esc([...r.used.keys()].join(', '))}${r.missed > 0.5 && r.best ? ` · ${esc(r.best.name)} pays ${r.bestRate}%` : ''}</div></div>${r.missed > 0.5 ? `<span class="chip warn">${ic('alert')}Missed ${money(r.missed)}</span>` : `<span class="chip ok">${ic('check')}Best card</span>`}</div>`).join('') || '<div class="empty">No card spending in the last 90 days.</div>'}</div>
    ${guide.length ? `<details class="explain"><summary>${ic('info')}Which card to use</summary><dl>${guide.map(g => `<div><dt>${esc(catName(g.cid))}</dt><dd>${esc(g.best.name)} · ${g.br}%</dd></div>`).join('')}</dl><p>Based on the reward rates you entered for each card.</p></details>` : ''}
  </div></div>`;
}
function payoffCard() {
  const debts = S.settings.accounts.filter(a => isLiab(a) && a.balance < -0.005).map(a => ({ id: a.id, name: a.name, bal: -a.balance, apr: +a.apr || 0, min: +a.minPayment || Math.max(25, round2(-a.balance * 0.02)) }));
  if (!debts.length) return `<div class="card"><div class="card-head"><h2>Debt payoff plan</h2></div><div class="card-body"><div class="empty"><b>No debts</b>Cards and loans with a balance show up here with a payoff date.</div></div></div>`;
  const p = S.settings.payoff, extra = +p.extra || 0, snow = p.strategy === 'snowball';
  const av = simulatePayoff(debts, extra, 'avalanche'), sn = simulatePayoff(debts, extra, 'snowball'), cur = snow ? sn : av, other = snow ? av : sn;
  const diff = round2(other.interest - cur.interest), missing = debts.filter(d => !d.apr).length;
  return `<div class="card"><div class="card-head"><div><h2>Debt payoff plan</h2><p>${snow ? 'Snowball: smallest balance first' : 'Avalanche: highest interest first'}</p></div><div class="seg" role="group" aria-label="Strategy"><button data-act="payoff-strategy" data-v="avalanche" aria-pressed="${!snow}">Avalanche</button><button data-act="payoff-strategy" data-v="snowball" aria-pressed="${snow}">Snowball</button></div></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
      <label class="field"><span>Extra paid toward debt each month</span><span class="money-in" style="max-width:180px"><input class="input" id="payoff-extra" inputmode="decimal" data-change="payoff-extra" value="${extra || ''}" placeholder="0"${can() ? '' : ' disabled'}></span></label>
      <div class="mini-tiles"><div><span>Debt-free</span><b>${cur.stuck ? 'Not on track' : mShortY(addM(CUR, cur.months))}</b></div><div><span>Total interest</span><b>${money(cur.interest, true)}</b></div><div><span>Months</span><b>${cur.stuck ? '50+ years' : cur.months}</b></div></div>
      ${cur.stuck ? `<p class="err">Minimum payments do not cover the interest. Add an extra amount above.</p>` : `<p style="font-size:13px;color:var(--ink-2)">${Math.abs(diff) < 1 ? 'Both strategies cost about the same here.' : diff > 0 ? `This order saves ${money(diff, true)} in interest compared with ${snow ? 'avalanche' : 'snowball'}.` : `${snow ? 'Avalanche' : 'Snowball'} would save ${money(-diff, true)} in interest. Snowball clears accounts sooner, which keeps some people motivated.`}</p>`}
      <div class="rows">${cur.debts.slice().sort((a, b) => (a.done || 999) - (b.done || 999)).map((d, i) => `<div class="row"><div class="date-chip"><span>Step</span><b>${i + 1}</b></div><div class="row-main"><div class="row-title">${esc(d.name)}</div><div class="row-sub">${money(debts.find(x => x.id === d.id).bal, true)} · ${d.apr ? d.apr + '% APR' : 'No APR set'} · ${money(d.min, true)} minimum</div></div><span class="chip ${d.done ? 'ok' : ''}">${d.done ? 'Paid off ' + mShortY(addM(CUR, d.done)) : 'Not paid off'}</span></div>`).join('')}</div>
      ${missing ? `<p style="font-size:12.5px;color:var(--muted)">${missing} debt${missing === 1 ? ' has' : 's have'} no APR. Edit the account to add it for accurate interest.</p>` : ''}
    </div></div>`;
}

function filteredTx() {
  if (S.ui.fStatus === 'internal' && !pooled()) S.ui.fStatus = 'all';
  const q = S.ui.q.trim().toLowerCase(), f = S.ui.fStatus;
  return IX.all.filter(t => (f === 'internal' ? IX.internal.has(t.id) : !IX.internal.has(t.id)) && (S.ui.fMonth === 'all' || t.date.startsWith(S.ui.fMonth)) && (S.ui.fAcct === 'all' || t.accountId === S.ui.fAcct) && (S.ui.fCat === 'all' || t.categoryId === S.ui.fCat) &&
    (f === 'all' || f === 'internal' || (f === 'uncat' && t.categoryId === 'uncat') || (f === 'shared' && t.shared) || (f === 'reimb' && t.reimb)) &&
    (!q || t.merchant.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q) || catName(t.categoryId).toLowerCase().includes(q) || String(Math.abs(t.amount)).includes(q)));
}
VIEWS.transactions = () => {
  const list = filteredTx(), shown = list.slice(0, S.ui.limit);
  const inc = sum(list.filter(t => typeOf(t.categoryId) === 'income'), eff), exp = -sum(list.filter(t => typeOf(t.categoryId) === 'expense'), eff);
  const months = Object.keys(S.months).sort().reverse();
  const filters = `<div class="filters"><label class="search">${ic('search')}<input class="input" id="f-q" data-input="q" placeholder="Search merchant, note, category, amount" value="${esc(S.ui.q)}" aria-label="Search transactions"></label>
    <select class="input" id="f-month" data-change="fMonth" aria-label="Month"><option value="all">All months</option>${months.map(m => `<option value="${m}"${S.ui.fMonth === m ? ' selected' : ''}>${mLong(m)}</option>`).join('')}</select>
    <select class="input" id="f-acct" data-change="fAcct" aria-label="Account"><option value="all">All accounts</option>${S.settings.accounts.map(a => `<option value="${a.id}"${S.ui.fAcct === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
    <select class="input" id="f-cat" data-change="fCat" aria-label="Category"><option value="all">All categories</option>${catOptions(S.ui.fCat)}</select>
    <select class="input" id="f-status" data-change="fStatus" aria-label="Type"><option value="all">All types</option>${[['uncat', 'Uncategorized'], ['shared', 'Shared with partner'], ['reimb', 'Reimbursable']].concat(pooled() ? [['internal', 'Moves between my accounts']] : []).map(([v, l]) => `<option value="${v}"${S.ui.fStatus === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`;
  const anyFilter = S.ui.q || S.ui.fMonth !== 'all' || S.ui.fAcct !== 'all' || S.ui.fCat !== 'all' || S.ui.fStatus !== 'all';
  const summary = `<div class="tx-summary"><span><b>${list.length.toLocaleString()}</b> transactions</span><span>Income <b>${money(inc)}</b></span><span>Your spending <b>${money(exp)}</b></span>${anyFilter ? `<button class="card-link" data-act="clear-filters">Clear filters</button>` : ''}</div>`;
  const days = []; let cur = null;
  for (const t of shown) { if (!cur || cur.d !== t.date) { cur = { d: t.date, items: [] }; days.push(cur); } cur.items.push(t); }
  const body = days.length ? days.map(d => `<div class="day"><div class="day-head"><span>${dLong(d.d)}</span><span class="num">${signed(round2(sum(d.items.filter(t => typeOf(t.categoryId) !== 'transfer'), t => t.amount)))}</span></div>${d.items.map(t => `
    <div class="tx">${txRow(t)}<select class="input" data-change="tx-cat" data-id="${t.id}" aria-label="Category for ${esc(t.merchant)}"${can() ? '' : ' disabled'}>${catOptions(t.categoryId)}</select>${amtHtml(t)}</div>`).join('')}</div>`).join('')
    : `<div class="empty" style="padding:40px 10px"><b>${IX.all.length ? 'No matches' : 'No transactions yet'}</b>${IX.all.length ? 'Try a different search or clear the filters.' : 'Add a transaction by hand or import a CSV file from your bank.'}</div>`;
  const more = list.length > shown.length ? `<div style="display:flex;justify-content:center;padding:14px"><button class="btn" data-act="tx-more">Show ${Math.min(150, list.length - shown.length)} more</button></div>` : '';
  const acts = btn('export-csv', 'Export', 'quiet', 'download') + btn('import', 'Import CSV', '', 'upload') + btn('add-tx', 'Add transaction', 'primary', 'plus');
  return `<div class="wrap">${head('Transactions', IX.all.length.toLocaleString() + ' total', acts)}${sampleBanner()}${filters}${summary}<div class="card" style="padding-bottom:6px">${body}${more}</div></div>`;
};

VIEWS['cash-flow'] = () => {
  const n = S.ui.cfRange; let start = addM(CUR, -(n - 1));
  const firstData = Object.keys(S.months).sort()[0];
  if (firstData && firstData > start) start = firstData;
  const groups = []; for (let ym = start; ym <= CUR; ym = addM(ym, 1)) { const st = monthStats(ym); groups.push({ key: ym, label: mShort(ym), long: mLong(ym), inc: st.income, exp: st.expense }); }
  if (!groups.some(g => g.key === S.ui.cfMonth)) S.ui.cfMonth = CUR;
  const tInc = sum(groups, g => g.inc), tExp = sum(groups, g => g.exp), full = groups.filter(g => g.key !== CUR);
  const avgRate = (() => { const f = full.filter(g => g.inc > 0); return f.length ? Math.round(sum(f, g => (g.inc - g.exp) / g.inc) / f.length * 100) : null; })();
  const sel = S.ui.cfMonth, st = monthStats(sel);
  const rangeSeg = `<div class="seg" role="group" aria-label="Range">${[[6, '6 months'], [12, '12 months']].map(([v, l]) => `<button data-act="cf-range" data-v="${v}" aria-pressed="${n === v}">${l}</button>`).join('')}</div>`;
  const breakdown = type => {
    const rows = Object.entries(st.byCat).filter(([id]) => typeOf(id) === type).map(([id, v]) => ({ id, v: type === 'income' ? v : -v })).filter(r => r.v > 0.004).sort((a, b) => b.v - a.v);
    const tot = sum(rows, r => r.v), max = rows.length ? rows[0].v : 1;
    return rows.length ? rows.map(r => `<button class="hbar ${type === 'income' ? 'inc' : ''}" data-act="drill" data-cat="${r.id}" data-month="${sel}" title="See these transactions"><span class="name">${esc(catName(r.id))}<small>${Math.round(r.v / (tot || 1) * 100)}%</small></span><span class="amt">${money(r.v)}</span><div class="meter"><i style="width:${r.v / max * 100}%"></i></div></button>`).join('')
      : `<div class="empty">No ${type === 'income' ? 'income' : 'spending'} in ${mName(sel)}.</div>`;
  };
  const merchants = (() => {
    const m = new Map(); for (const t of S.months[sel] || []) { if (typeOf(t.categoryId) !== 'expense' || eff(t) >= 0) continue; m.set(t.merchant, (m.get(t.merchant) || 0) - eff(t)); }
    const rows = [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    return rows.length ? rows.map(([k, v]) => `<div class="row"><div class="row-main"><div class="row-title">${esc(k)}</div></div><span class="amt">${money(v)}</span></div>`).join('') : `<div class="empty">No spending in ${mName(sel)}.</div>`;
  })();
  const table = `<div class="table-wrap"><table><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th><th>Savings rate</th></tr></thead><tbody>${groups.slice().reverse().map(g => `<tr class="${g.key === sel ? 'is-sel' : ''}"><td>${g.long}${g.key === CUR ? ' <span class="chip">' + ic('clock') + 'In progress</span>' : ''}</td><td>${money(g.inc, true)}</td><td>${money(g.exp, true)}</td><td class="${g.inc - g.exp < 0 ? 'amt neg' : ''}">${signed(round2(g.inc - g.exp), true)}</td><td>${g.inc > 0 ? Math.round((g.inc - g.exp) / g.inc * 100) + '%' : '–'}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="wrap">${head('Cash flow', mLong(start) + ' to ' + mLong(CUR), rangeSeg)}${sampleBanner()}
    <div class="tiles"><div class="tile"><span class="tile-label">Income</span><span class="tile-value">${money(tInc, true)}</span><span class="tile-sub">${groups.length} months</span></div><div class="tile"><span class="tile-label">Expenses</span><span class="tile-value">${money(tExp, true)}</span><span class="tile-sub">Your share only, transfers left out</span></div><div class="tile"><span class="tile-label">Net</span><span class="tile-value">${money(tInc - tExp, true)}</span><span class="tile-sub">Income minus expenses</span></div><div class="tile"><span class="tile-label">Avg savings rate</span><span class="tile-value">${avgRate === null ? '–' : avgRate + '%'}</span><span class="tile-sub">Full months only</span></div></div>
    <div class="card"><div class="card-head"><div><h2>Income and expenses by month</h2><p>Select a month to see where the money went</p></div><div class="legend"><span><i class="key inc"></i>Income</span><span><i class="key exp"></i>Expenses</span></div></div><div class="card-body">${chartSlot('ch-cf', { type: 'bars', groups, selected: sel, label: 'Income and expenses by month', onSelect: k => { S.ui.cfMonth = k; render(); } }, 260)}</div></div>
    <div class="card"><div class="card-head"><h2>Monthly totals</h2></div><div class="card-body">${table}</div></div>
    <div class="page-head"><div><p class="eyebrow">Breakdown · select a row to see its transactions</p><h1 style="font-size:20px">${mLong(sel)}</h1></div><div class="seg" role="group" aria-label="Month">${groups.slice(-6).map(g => `<button data-act="cf-month" data-v="${g.key}" aria-pressed="${g.key === sel}">${g.label}</button>`).join('')}</div></div>
    <div class="grid g-3" style="align-items:start"><div class="card"><div class="card-head"><h2>Income</h2><span class="amt">${money(st.income)}</span></div><div class="card-body">${breakdown('income')}</div></div><div class="card"><div class="card-head"><h2>Spending by category</h2><span class="amt">${money(st.expense)}</span></div><div class="card-body">${breakdown('expense')}</div></div><div class="card"><div class="card-head"><h2>Top merchants</h2></div><div class="card-body"><div class="rows">${merchants}</div></div></div></div></div>`;
};

VIEWS.forecast = () => {

  const base = [m.start].concat(rows.map(r => r.base)), what = [m.start].concat(rows.map(r => r.what));

    <div class="mini-tiles"><div><span>Cash and savings</span><b>${money(rw.liquid, true)}</b></div><div><span>At essential spending</span><b>${rw.ess === null ? '–' : months1(rw.ess) + ' months'}</b></div><div><span>At current spending</span><b>${rw.all === null ? '–' : months1(rw.all) + ' months'}</b></div></div>
    ${rw.ess !== null ? `<div>${meterHtml(Math.min(rw.ess, 6), 6, rwCls)}<p style="font-size:12px;color:var(--muted);margin-top:4px">Target: 6 months of essentials, ${money(av.ess * 6, true)}</p></div>` : ''}
    ${cuts.length && rw.all !== null ? `<div><h3 style="margin-bottom:4px">Pausing these adds the most runway</h3><div class="rows">${cuts.map(([c, v]) => `<div class="row"><div class="row-main"><div class="row-title">${esc(catName(c))}</div><div class="row-sub">${money(v, true)} a month on average</div></div><span class="chip ok">+${months1(rw.liquid / (av.total - v) - rw.all)} months</span></div>`).join('')}</div></div>` : ''}
  </div></div>`;
  const assume = explain([['Cash and savings today', money(m.liquid)], ['Credit card balances', money(-m.owed)], ['Starting point', money(m.start), true],
    ['Scheduled income', money(m.recIncMo) + '/mo'], ['Other income, average', money(m.otherInc) + '/mo'], ['Scheduled bills, your share', money(-m.recBillMo) + '/mo'], ['Everyday spending, average', money(-m.flex) + '/mo'], ['Owed back to you', money(m.expected) + ' next month']],
    `Averages use your last ${m.n || 0} full months. Scheduled items come from the Recurring page, with yearly costs in the month they are due.`);
  const table = `<div class="table-wrap"><table><thead><tr><th>Month</th><th>Income</th><th>Bills</th><th>Everyday</th>${scnOn ? '<th>What-if costs</th>' : ''}<th>Cash at end</th>${scnOn ? '<th>What-if cash</th>' : ''}</tr></thead><tbody>${rows.map(r => `<tr><td>${mShortY(r.ym)}${r.ym === CUR ? ' <span class="chip">rest of month</span>' : ''}</td><td>${money((scnOn ? r.incS : r.inc) + r.back, true)}</td><td>${money(-r.bills, true)}</td><td>${money(-r.flex, true)}</td>${scnOn ? `<td>${money(-(r.extra + r.one), true)}</td>` : ''}<td class="${r.base < 0 ? 'amt neg' : ''}">${money(r.base, true)}</td>${scnOn ? `<td class="${r.what < 0 ? 'amt neg' : ''}">${money(r.what, true)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
  const seg = `<div class="seg" role="group" aria-label="Horizon">${[[6, '6 months'], [12, '12 months']].map(([v, l]) => `<button data-act="fc-months" data-v="${v}" aria-pressed="${fc.months === v}">${l}</button>`).join('')}</div>`;
  const lines = scnOn ? [{ name: 'No change', cls: 's1', values: base }, { name: 'What-if', cls: 's2', values: what }] : [{ name: 'Projected cash', cls: 's1', values: base }];
  return `<div class="wrap">${head('Forecast', 'Your cash, month by month', seg)}${sampleBanner()}
    <div class="tiles"><div class="tile"><span class="tile-label">Cash today</span><span class="tile-value">${money(m.start, true)}</span><span class="tile-sub">After paying off card balances</span>${assume}</div><div class="tile"><span class="tile-label">In ${fc.months} months</span><span class="tile-value">${money(base[base.length - 1], true)}</span><span class="tile-sub">${deltaHtml(round2(base[base.length - 1] - m.start))} if nothing changes</span></div><div class="tile"><span class="tile-label">With your what-if</span><span class="tile-value">${scnOn ? money(what[what.length - 1], true) : '–'}</span><span class="tile-sub">${scnOn ? deltaHtml(round2(what[what.length - 1] - base[base.length - 1])) + ' vs no change' : 'Try a change below'}</span></div><div class="tile"><span class="tile-label">Lowest point</span><span class="tile-value"${low < 0 ? ' style="color:var(--neg)"' : ''}>${money(low, true)}</span><span class="tile-sub">${lowI === 0 ? 'Today' : 'End of ' + mShortY(rows[lowI - 1].ym)}${low < 0 ? ` <span class="chip crit">${ic('alert')}Runs short</span>` : ''}</span></div></div>
    <div class="card"><div class="card-head"><div><h2>What-if</h2><p>Test a decision before you make it. Nothing here changes your real budget.</p></div>${scnOn ? `<button class="btn sm quiet" data-act="fc-reset">Reset</button>` : ''}</div><div class="card-body"><div class="f2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <label class="field"><span>Change in income</span><span class="pct-in"><input class="input" id="fc-inc" inputmode="decimal" data-change="fc" data-k="incPct" value="${fc.incPct || ''}" placeholder="-15"></span><small>-15 means a job paying 15% less</small></label>
      <label class="field"><span>New monthly cost</span><span class="money-in"><input class="input" id="fc-extra" inputmode="decimal" data-change="fc" data-k="extra" value="${fc.extra || ''}" placeholder="0"></span><small>A car payment, daycare, higher rent</small></label>

};

VIEWS.budget = () => {
  const ym = S.ui.budMonth, bf = budgetFor(ym), b = bf.map, st = monthStats(ym), sm = S.settings.smoothing, sms = smoothingState();
  const incCats = S.settings.categories.filter(c => typeOf(c.id) === 'income');
  const expGroups = S.settings.groups.filter(g => g.type === 'expense');
  const planIncRaw = sum(incCats, c => b[c.id] || 0), useSalary = sm.enabled && sms.salary !== null;
  const planInc = useSalary ? sms.salary : planIncRaw, gotInc = st.income;
  const expCats = S.settings.categories.filter(c => typeOf(c.id) === 'expense');
  const planExp = sum(expCats, c => b[c.id] || 0), spent = st.expense, left = round2(planInc - planExp);
  const av = avgSpend(3);
  const moneyInput = c => `<span class="money-in"><input class="input" id="b-${c.id}" inputmode="decimal" data-change="budget" data-cat="${c.id}" value="${b[c.id] ? b[c.id] : ''}" placeholder="0"${can() ? '' : ' disabled'} aria-label="Budget for ${esc(c.name)}"></span>`;
  const incRows = incCats.map(c => { const got = st.byCat[c.id] || 0, plan = b[c.id] || 0; return `<div class="brow"><span class="bname"><span>${esc(c.name)}</span></span>${moneyInput(c)}<span class="bnum amt">${money(got, true)}</span><div class="bprog"><div class="meter inc"><i style="width:${plan > 0 ? Math.min(100, got / plan * 100) : (got > 0 ? 100 : 0)}%"></i></div><small><span>${money(got, true)} received</span><span>${plan > 0 ? Math.round(got / plan * 100) + '%' : ''}</span></small></div></div>`; }).join('');
  const groupCards = expGroups.map(g => {
    const cats = S.settings.categories.filter(c => c.group === g.id); if (!cats.length) return '';
    const gb = sum(cats, c => (b[c.id] || 0) + carryFor(c, ym)), gs = -sum(cats, c => st.byCat[c.id] || 0);
    return `<div class="card"><div class="card-head"><h2>${esc(g.name)}</h2><span class="group-total num">${money(gs, true)} of ${money(gb, true)}</span></div><div class="card-body"><div class="brow head"><span>Category</span><span style="text-align:right">Budget</span><span class="bnum">Spent</span><span>Progress</span></div>${cats.map(c => {
      const s = round2(-(st.byCat[c.id] || 0)), carry = carryFor(c, ym), bb = (b[c.id] || 0) + carry;
      const hint = c.rollover ? `Rollover ${Math.abs(carry) >= 0.5 ? signed(carry, true) : 'on'}` : av.byCat[c.id] > 1 ? `3-month avg ${money(av.byCat[c.id], true)}` : '';
      return `<div class="brow"><span class="bname">${can() ? `<button class="icon-btn" data-act="toggle-roll" data-id="${c.id}" aria-pressed="${!!c.rollover}" title="${c.rollover ? 'Rollover is on. Leftover money carries into next month.' : 'Turn on rollover'}" aria-label="Rollover for ${esc(c.name)}">${ic('roll')}</button>` : ''}<span>${esc(c.name)}${hint ? `<small>${hint}</small>` : ''}</span></span>${moneyInput(c)}<span class="bnum amt">${money(s, true)}</span><div class="bprog">${meterHtml(s, bb)}<small><span>${bb > 0 ? (s - bb > 0.5 ? `<span class="amt neg">${money(s - bb, true)} over</span>` : money(bb - s, true) + ' left') : (s > 0 ? money(s, true) + ' spent, no budget' : 'No budget')}</span><span>${bb > 0 ? Math.round(s / bb * 100) + '%' : ''}</span></small></div></div>`;
    }).join('')}</div></div>`;
  }).join('');
  const arrow = d => ic(d, ' style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;vertical-align:-2px"');
  const stepper = `<div class="seg" role="group" aria-label="Month"><button data-act="bud-prev" aria-label="Previous month">${arrow('left')}</button><button aria-pressed="true" data-act="bud-today">${mShortY(ym)}</button><button data-act="bud-next" aria-label="Next month">${arrow('right')}</button></div>`;
  const carried = bf.from && bf.from !== ym ? `<div class="banner"><p>These amounts carry over from <b>${mLong(bf.from)}</b>. Change any number to set a budget for ${mName(ym)} and the months after it.</p></div>` : (!bf.from ? `<div class="banner"><p><b>No budget yet.</b> Type an amount next to each category, or fill them from your 3-month averages. Budgets carry forward each month until you change them.</p></div>` : '');
  const mo = sms.months;
  const smChip = !sm.enabled || mo === null ? '' : mo < 3 ? `<span class="chip crit">${ic('alert')}Below 3 months</span>` : `<span class="chip ok">${ic('check')}${months1(mo)} months of buffer</span>`;
  const smMath = explain([['Starting buffer', money(+sm.startBuffer || 0)], [`Income received since ${mShortY(sms.start)}`, money(sms.paidIn)], ['Salary paid to yourself', money(-sms.paidOut)], ['Buffer now', money(sms.pot), true], [`Salary, average of ${sms.n} month${sms.n === 1 ? '' : 's'}`, sms.salary === null ? '–' : money(sms.salary)]],
    'Your salary is the average of your income over up to 12 months. Good months refill the buffer and lean months draw from it.');
  const smCard = `<div class="card"><div class="card-head"><div><h2>Irregular income</h2><p>Pay yourself the same salary every month, even when income swings</p></div>${smChip}</div><div class="card-body" style="display:flex;flex-direction:column;gap:12px">
      ${sms.salary === null ? '<p style="color:var(--ink-2)">Needs at least one full month of income history.</p>' : `<div class="mini-tiles"><div><span>Monthly salary</span><b>${money(sms.salary, true)}</b></div><div><span>Buffer</span><b>${money(sms.pot, true)}</b></div><div><span>Buffer covers</span><b>${mo === null ? '–' : months1(Math.max(0, mo)) + ' months'}</b></div></div>`}
      ${smMath}
      ${can() ? `<form id="smooth-form" class="f2" style="align-items:end"><label class="field"><span>Starting buffer</span><span class="money-in"><input class="input" name="startBuffer" inputmode="decimal" value="${sm.startBuffer || ''}" placeholder="Set aside for lean months"></span></label><div style="display:flex;gap:8px;justify-content:flex-end">${sm.enabled ? '<button class="btn" type="submit">Save</button><button class="btn quiet" type="button" data-act="smooth-off">Turn off</button>' : '<button class="btn primary" type="submit">Turn on</button>'}</div></form>` : ''}
      ${!sm.enabled ? '<p style="font-size:12.5px;color:var(--muted)">When on, your budget plans around this salary in place of the income you expect.</p>' : ''}
    </div></div>`;
  const acts = btn('bud-fill', 'Fill empty from averages', 'sm', '') + btn('export-budget', 'Export budget', 'sm quiet', 'download');
  return `<div class="wrap">${head('Budget', mLong(ym), stepper)}${sampleBanner()}${carried}
    <div class="tiles"><div class="tile"><span class="tile-label">${useSalary ? 'Your salary' : 'Expected income'}</span><span class="tile-value">${money(planInc, true)}</span><span class="tile-sub">${money(gotInc, true)} received</span></div><div class="tile"><span class="tile-label">Budgeted spending</span><span class="tile-value">${money(planExp, true)}</span><span class="tile-sub">${expCats.filter(c => b[c.id] > 0).length} categories</span></div><div class="tile"><span class="tile-label">Spent so far</span><span class="tile-value">${money(spent, true)}</span><span class="tile-sub">${planExp > 0 ? statusChip(spent, planExp) : 'Set budgets below'}</span></div><div class="tile"><span class="tile-label">Left to budget</span><span class="tile-value"${left < 0 ? ' style="color:var(--neg)"' : ''}>${money(left, true)}</span><span class="tile-sub">${left < 0 ? `<span class="chip crit">${ic('alert')}Budget exceeds income</span>` : left > 0.5 ? 'Assign it or save it' : `<span class="chip ok">${ic('check')}Every dollar has a job</span>`}</span>${explain([[useSalary ? 'Salary' : 'Expected income', money(planInc)], ['Budgeted spending', money(-planExp)], ['Left to budget', money(left), true]], 'Rollover amounts are not new money, so they stay out of this number.')}</div></div>
    <div class="page-head" style="margin-top:-4px"><p class="note">Shared costs count at your share. Pending reimbursements do not count as spending. Select the ${ic('roll')} button on a category to roll its leftover money into next month.</p><div class="head-actions">${acts}</div></div>
    <div class="grid g-half" style="align-items:start"><div class="card"><div class="card-head"><h2>Income</h2><span class="group-total num">${money(gotInc, true)} of ${money(planIncRaw, true)}</span></div><div class="card-body"><div class="brow head"><span>Category</span><span style="text-align:right">Expected</span><span class="bnum">Received</span><span>Progress</span></div>${incRows}</div></div>${smCard}</div>
    ${groupCards}</div>`;
};

VIEWS.recurring = () => {
  const rs = S.settings.recurring, prices = priceChanges(), priceMap = new Map(prices.map(p => [p.r.id, p]));
  const billsMo = -sum(rs.filter(r => r.amount < 0), r => recShare(r) * (PER_MONTH[r.cadence] || 1));
  const incMo = sum(rs.filter(r => r.amount > 0), r => r.amount * (PER_MONTH[r.cadence] || 1));
  const monthStart = CUR + '-01', monthEnd = CUR + '-' + pad(daysIn(CUR));
  const thisMonth = rs.flatMap(r => occurrences(r, monthStart, monthEnd).map(d => ({ r, d }))).sort((a, b) => a.d.localeCompare(b.d));
  const due30 = -sum(rs.filter(r => r.amount < 0).flatMap(r => occurrences(r, TODAY, addDays(TODAY, 30)).map(() => r.amount)));
  const cal = thisMonth.length ? thisMonth.map(({ r, d }) => {
    const paid = matchPaid(r, d);
    const chip = paid ? `<span class="chip ok">${ic('check')}${r.amount > 0 ? 'Received' : 'Paid'} ${dShort(paid.date)}</span>` : d >= TODAY ? `<span class="chip">${ic('clock')}${d === TODAY ? 'Due today' : 'In ' + daysBetween(TODAY, d) + ' days'}</span>` : `<span class="chip warn">${ic('alert')}Not seen yet</span>`;
    return `<div class="row"><div class="date-chip"><span>${mShort(d.slice(0, 7))}</span><b>${+d.slice(8)}</b></div><div class="row-main"><div class="row-title">${esc(r.name)}</div><div class="row-sub">${esc(catName(r.categoryId))} · ${esc(acctName(r.accountId))}</div></div>${chip}<span class="amt ${r.amount > 0 ? 'pos' : ''}" style="min-width:92px">${r.amount > 0 ? signed(r.amount) : money(r.amount)}</span></div>`;
  }).join('') : `<div class="empty"><b>Nothing scheduled this month</b>Add rent, subscriptions, and paychecks to see them here.</div>`;
  const all = rs.filter(r => r.cadence !== 'yearly').sort((a, b) => (nextDue(a) || '9').localeCompare(nextDue(b) || '9'));

/* ---------- render ---------- */
const mainEl = document.getElementById('main');
function renderNav() {
  const att = S.phase === 'ready' && S.settings && IX ? attention().filter(a => a.sev !== 'info').length : 0;
  document.getElementById('nav').innerHTML = NAV.map(([id, label]) => `<a href="#${id}"${S.route === id ? ' aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id]}</svg>${label}${id === 'overview' && att ? `<span class="badge" title="${att} items need attention">${att}</span>` : ''}</a>`).join('');
}
let rendering = false, renderAgain = false;
function render() {
  // Replacing the page can blur a focused input, which fires its change handler and asks for another render. Queue it.
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; render(); }
}
function renderNow() {
  if (S.phase === 'ready' && S.settings && !IX) reindex();
  renderNav();
  if (S.phase === 'loading') { mainEl.innerHTML = viewLoading(); return; }
  if (S.phase === 'empty' || !S.settings) { mainEl.innerHTML = viewOnboard(); return; }
  const a = document.activeElement, fid = a && a.id && mainEl.contains(a) ? a.id : null;
  let ss = null, se = null; try { if (fid) { ss = a.selectionStart; se = a.selectionEnd; } } catch (e) {}
  const openIdx = [...mainEl.querySelectorAll('details')].map((d, i) => d.open ? i : -1).filter(i => i >= 0), sameRoute = mainEl.dataset.route === S.route;
  for (const k in CH) delete CH[k];
  mainEl.innerHTML = (VIEWS[S.route] || VIEWS.overview)();
  mainEl.dataset.route = S.route;
  if (sameRoute) { const all = mainEl.querySelectorAll('details'); openIdx.forEach(i => { if (all[i]) all[i].open = true; }); }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { if (ss !== null) el.setSelectionRange(ss, se); } catch (e) {} } }
  drawCharts();
}

/* ---------- CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function parseAnyDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(m[1])}-${pad(m[2])}`; }
  const t = Date.parse(s); return isNaN(t) ? null : fmtD(new Date(t));
}
function guessMap(h) {
  const L = h.map(x => x.toLowerCase().trim()), f = re => L.findIndex(x => re.test(x));
  const amount = L.findIndex(x => /amount|amt|value/.test(x) && !/debit|credit/.test(x));
  return { date: f(/date|posted/), desc: f(/desc|merchant|payee|name|memo|details|original/), amount, debit: amount >= 0 ? -1 : f(/debit|withdraw|money out/), credit: amount >= 0 ? -1 : f(/credit|deposit|money in/), cat: f(/categ/) };
}
function importRows() {
  const d = S.modal.data, mp = d.map, out = [];
  for (const r of d.rows) {
    const date = parseAnyDate(r[mp.date]); const merchant = String(r[mp.desc] || '').trim();
    let amt = null;
    if (mp.amount >= 0) { amt = parseMoney(r[mp.amount]); if (amt !== null && d.flip) amt = -amt; }
    else { const de = parseMoney(r[mp.debit]), cr = parseMoney(r[mp.credit]); if (de !== null || cr !== null) amt = (cr ? Math.abs(cr) : 0) - (de ? Math.abs(de) : 0); }
    if (!date || !merchant || amt === null || isNaN(amt)) continue;
    let categoryId = 'uncat';
    const rule = ruleFor(merchant); if (rule) categoryId = rule.categoryId;
    else if (mp.cat >= 0) { const cn = String(r[mp.cat] || '').trim().toLowerCase(); const c = S.settings.categories.find(x => x.name.toLowerCase() === cn); if (c) categoryId = c.id; }
    out.push({ id: newId('t'), date, merchant, amount: round2(amt), categoryId, accountId: d.accountId || '', notes: '' });
  }
  return out;
}

  const mp = d.map, parsed = importRows();

    <div class="f2"><label class="field"><span>Date column</span><select class="input" data-change="import-map" data-k="date">${opt(mp.date)}</select></label><label class="field"><span>Description column</span><select class="input" data-change="import-map" data-k="desc">${opt(mp.desc)}</select></label>

/* ---------- export ---------- */
function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
async function offerFile(filename, text, title) {
  if (Store.downloads) {
    try { await Store.downloads.save({ filename, data: text }); toast('Saved ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  if (window.keelNative && window.keelNative.saveFile) {
    try { const r = await window.keelNative.saveFile(filename, text); if (r && r.status === 'saved') toast('Saved ' + filename); return; } catch (e) {}
  } else if (!window.claude && !window.Capacitor) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.json') ? 'application/json' : 'text/csv' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Downloaded ' + filename); return;
    } catch (e) {}
  }
  openModal('text', { title, text, note: 'Copy this text and paste it into a file named ' + filename + '.' });
}
function budgetCSV() {
  const keys = Object.keys(S.settings.budgets).sort(), start = keys[0] || CUR, rows = [['Month', 'Group', 'Category', 'Budget', 'Rollover', 'Actual (your share)', 'Left']];
  for (let ym = start; ym <= CUR; ym = addM(ym, 1)) {
    const b = budgetFor(ym).map, st = monthStats(ym);
    for (const c of S.settings.categories) {

  if (m.type === 'fund') {
    const amt = parseMoney(str('amount')); if (!amt) return modalError('Enter an amount.');
    const g = S.settings.goals.find(x => x.id === m.data.goal.id); if (g) { g.saved = round2(Math.max(0, g.saved + amt)); if (g.saved >= g.target && amt > 0) toast(g.name + ' is fully funded.'); }
    closeModal(); changed('settings'); return;
  }
  if (m.type === 'category') {
    if (!str('name')) return modalError('Enter a name.');
    if (m.data.cat) { const c = S.settings.categories.find(x => x.id === m.data.cat.id); if (c) { c.name = str('name'); c.group = str('group'); c.essential = fd.get('essential') === 'on'; } }
    else S.settings.categories = [...S.settings.categories, { id: newId('c'), name: str('name'), group: str('group'), essential: fd.get('essential') === 'on' }];
    closeModal(); changed('settings'); return;
  }
  if (m.type === 'household') {
    const split = parseMoney(str('split')); if (!str('partnerName')) return modalError('Enter a name.'); if (split === null || split <= 0 || split >= 100) return modalError('Your share must be between 1 and 99 percent.');
    S.settings.household = { ...S.settings.household, partnerName: str('partnerName'), split: Math.round(split) }; closeModal(); changed('settings'); return;
  }
  if (m.type === 'settle') {
    const amt = parseMoney(str('amount')); if (!amt) return modalError('Enter an amount.');
    const lg = ledger(), owe = lg.bal < 0;
    const t = { id: newId('t'), date: str('date') || TODAY, merchant: owe ? `Payment to ${partner()}` : `Payment from ${partner()}`, amount: round2(owe ? -Math.abs(amt) : Math.abs(amt)), categoryId: 'settle', accountId: str('accountId'), notes: 'Shared costs' };
    const docs = ['m-' + insertTx(t)]; if (adjustBal(t.accountId, t.amount)) docs.push('settings');
    closeModal(); changed(...docs); toast('Payment recorded.'); return;
  }
  if (m.type === 'match') {
    const exp = findTx(m.data.id); if (!exp) return closeModal();
    const docs = ['m-' + exp.date.slice(0, 7)];
    if (fd.get('nomatch') === 'on' || !fd.get('cand')) { exp.reimb = { ...exp.reimb, status: 'paid', paidDate: TODAY }; }
    else {
      const inc = findTx(String(fd.get('cand'))); if (!inc) return modalError('Pick a deposit.');
      inc.categoryId = 'reimb'; inc.reimbFor = exp.id; docs.push('m-' + inc.date.slice(0, 7));
      exp.reimb = { ...exp.reimb, status: 'paid', paidDate: inc.date, paidId: inc.id, amount: round2(Math.min(inc.amount, Math.abs(exp.amount))) };
    }
    closeModal(); changed(...docs); toast('Reimbursement matched.'); return;
  }
  if (m.type === 'import') {
    const list = m.data.ready || []; if (!list.length) return modalError('Nothing new to import. Check the column choices above.');
    const docs = []; for (const t of list) docs.push('m-' + insertTx(t));
    closeModal(); S.ui.fMonth = 'all'; changed(...docs); toast(`Imported ${list.length} transaction${list.length === 1 ? '' : 's'}.`); return;
  }
});

boot();
})();
</script>

  navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
