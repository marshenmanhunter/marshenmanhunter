# Publishes a Keel release that installed apps update from.
# To release: set "version" in keel-app/package.json, write keel-app/release-notes.md and commit.
# Then either run this workflow from the Actions tab (Release Keel, Run workflow, pick the branch),
# or push a tag named v plus the version (for example v2.4.0). The release tag is v plus the version.
name: Release Keel

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Work out the release tag
        run: |
          VERSION=$(node -p "require('./keel-app/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match app version $VERSION"; exit 1; fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "Release $TAG is already published. Raise the version in keel-app/package.json first."; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Keel ${TAG#v}" --notes-file keel-app/release-notes.md

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            script: release:mac
          - os: windows-latest
            script: release:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: keel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keel-app/package-lock.json
      - run: npm ci
      - run: npm run build:web
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release so installed apps see it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
